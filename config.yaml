models_csv: "models.csv"

apo_dir:  "/data/raw_data/computational_data/curations_data/bh3_bcl/bcl2/apo_from_complexes"
slim_dir: "/data/raw_data/computational_data/curations_data/bh3_bcl/bcl2/fasta_slim"
out_dir:  "."

cabsdock:
    mc_runs: 300
    k-medoids: 20
    clustering-iterations: 250
    saved_pdb: "A"
    verbose: 4
    dssp_location: "/usr/local/dssp-3.0.10/bin/mkdssp"
    run_types:
        blind:
            ss_def: null
            restraints: null
        blind_2D:
            ss_def: 'CCCCCCCCCCCCCCCCCHHCHHHCCCCCCCC'
            restraints: null
        Q-R_Q-N:
            ss_def: 'CCCCCCCCCCCCCCCCCHHCHHHCCCCCCCC'
            restraints:
                - '--ca-rest-add 102:A 20:PEP 6.5 1.0'
                - '--ca-rest-add 99:A 20:PEP 5.0 1.0'
        Q-R_Q-N_E-N:
            ss_def: 'CCCCCCCCCCCCCCCCCHHCHHHCCCCCCCC'
            restraints:
                - '--ca-rest-add 102:A 20:PEP 6.5 1.0'
                - '--ca-rest-add 99:A 20:PEP 5.0 1.0'
                - '--ca-rest-add 99:A 23:PEP 6.5 1.0'

